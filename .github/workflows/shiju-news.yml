name: 本日の需給状況ニュース

on:
  schedule:
    # 20:15 JST（月〜金）= 11:15 UTC：JPX PDFと当日売買代金データの更新を待ってランキング計算
    - cron: '15 11 * * 1-5'
    # 08:30 JST（月〜金）= 前日23:30 UTC：LINE通知
    - cron: '30 23 * * 0-4'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: true
        type: choice
        options:
          - calculate
          - notify

permissions:
  contents: write

concurrency:
  group: shiju-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calculate:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 11 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'calculate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: JPX信用残を取得してスコア計算
        env:
          ZENITH_API_KEY: ${{ secrets.ZENITH_API_KEY }}
        run: python app.py calculate

      - name: 算出結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_report.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update daily margin supply-demand score"
            git push
          fi

  notify:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 23 * * 0-4') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'notify') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: LINEに需給ランキングを通知
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: python app.py notify
